---
- name: Laboratorio Ansible con Docker
  hosts: docker
  gather_facts: yes

  tasks:
    - name: Mostrar nombre del host
      debug:
        msg: "Servidor: {{ inventory_hostname }}"

    - name: Mostrar sistema operativo
      debug:
        msg: "Sistema operativo: {{ ansible_facts['distribution'] }}"

    - name: Crear directorio principal
      file:
        path: /tmp/ansible-demo
        state: directory
        mode: '0755'

    - name: Crear archivo info.txt
      copy:
        dest: /tmp/ansible-demo/info.txt
        content: |
          Servidor: {{ inventory_hostname }}
          Sistema operativo: {{ ansible_facts['distribution'] }}
        mode: '0644'

    - name: Crear directorios mediante loop
      file:
        path: "/tmp/ansible-demo/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - logs
        - backup
        - config

    - name: Mostrar mensaje si el sistema es Ubuntu
      debug:
        msg: "Este servidor utiliza Ubuntu."
      when: ansible_facts['distribution'] == "Ubuntu"